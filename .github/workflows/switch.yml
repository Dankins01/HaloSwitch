# The Nintendo Switch build (port/switch/README.md): opence.nro.
#
# Two jobs, because the halves need different toolchains:
#
# - guest: the game image, built exactly as the Android port builds it
#   (an ILP32 AArch64 image, with the runner's clang and the Android NDK's
#   linker), plus the host's generated import table;
# - nro: the Switch host, built with devkitA64 in devkitPro's container, with
#   the image packed into the NRO's romfs.
#
# Run it from the Actions tab ("Run workflow"), or push to a branch whose
# name starts with "switch". The .nro is the "opence-switch" artifact.
#
# The game data is not part of the build: the player supplies a disc image
# of their own (port/switch/README.md).

name: switch

on:
  workflow_dispatch:
  push:
    branches: ["switch*"]
    paths: ["port/**", "source/**", "tools/**", "configure.py", ".github/workflows/switch.yml"]

jobs:
  guest:
    # The runner image has the Android SDK and NDK (whose ld.lld links the
    # image), and a clang with the arm64_32 target.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install ninja
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      # musl and SDL3's headers, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py') }}

      - name: Build the game image
        run: |
          clang --version | head -1
          python3 configure.py --release
          ninja build/android/halo_guest.elf build/android/host/host_import_table.c

      - uses: actions/upload-artifact@v4
        with:
          name: switch-guest
          path: |
            build/android/halo_guest.elf
            build/android/host/host_import_table.c
          retention-days: 3

  nro:
    needs: guest
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: switch-guest
          path: build/android

      # (devkitPro's package server sometimes does not answer: try again)
      - name: Install the Switch libraries
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm --needed switch-sdl2 switch-mesa switch-libdrm_nouveau && exit 0
            echo "attempt $attempt failed; trying again"
            sleep $((attempt * 15))
          done
          exit 1

      # (the compiler's errors also become one annotation, readable without
      # opening the log)
      - name: Build opence.nro
        shell: bash
        run: |
          ls -l build/android build/android/host
          set +e
          make -C port/switch GUEST=../../build/android SWITCH_BUILD="${GITHUB_SHA::7}" -j"$(nproc)" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            report=$(grep -E -B2 -A3 "error|undefined reference|No such file|Error [0-9]" build.log | head -c 12000 \
              | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=switch build::${report}"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        with:
          name: opence-switch
          path: port/switch/opence.nro
          retention-days: 14

      # the host's symbols, for reading crash reports
      - uses: actions/upload-artifact@v4
        with:
          name: switch-symbols
          path: port/switch/build/opence.elf
          retention-days: 14

  # The build's files on the switch-builds branch (one commit, replaced
  # each time): the .nro, and the two programs' symbols for reading crash
  # reports. A branch can be fetched with git where artifacts cannot.
  publish:
    needs: [guest, nro]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Push to switch-builds
        shell: bash
        run: |
          mkdir publish
          cp out/opence.nro out/opence.elf out/halo_guest.elf publish/
          cd publish
          for file in opence.elf halo_guest.elf; do
            # (GitHub refuses files over 100 MB)
            if [ "$(stat -c %s "$file")" -gt 95000000 ]; then strip --strip-debug "$file" || true; fi
          done
          ls -l
          printf 'Build %s of %s (%s)\n' "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > BUILD.txt
          git init -q -b switch-builds
          git config user.name "switch build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Switch build ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" switch-builds
